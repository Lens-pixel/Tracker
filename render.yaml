services:
  - type: web
    name: calorie-tracker-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: BOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.8-flash
      - key: FREE_ANALYSES_LIMIT
        value: "5"
      - key: SUB_PRICE_1M_STARS
        value: "250"
      - key: SUB_PRICE_3M_STARS
        value: "600"
      - key: KASPI_ENABLED
        value: "true"
      - key: KASPI_PHONE
        sync: false
      - key: KASPI_RECIPIENT
        value: Администрация сервиса
      - key: KASPI_PRICE_1M_KZT
        value: "2490"
      - key: KASPI_PRICE_3M_KZT
        value: "5990"
      - key: SUPPORT_CONTACT
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_URL
        sync: false
